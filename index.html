<style>

<body>
<h1>AI Sandbox</h1>
<div id="view"><p class="dim">Loading...</p></div>
<div id="toast"></div>
<script>
"use strict";

// ================================================================ CONSTANTS
const SIZE = 32;                 // canvas is SIZE x SIZE
const SAMPLE_RATE = 22050;       // audio quality of the songs
const MAX_SONG_SECONDS = 60;     // longest song the AI can write
const MAX_TRACKS = 4;            // channels per song
const JOURNAL_SHOWN = 15;        // journal entries the AI sees each turn
const MESSAGES_SHOWN = 12;       // chat messages the AI sees each turn
const MAX_NOTES_PER_TRACK = 800;

const PALETTE = {
  ".": "#ffffff", k: "#000000", d: "#555555", w: "#aaaaaa",
  r: "#e53935", o: "#fb8c00", y: "#fdd835", g: "#43a047",
  l: "#9ccc65", c: "#00acc1", s: "#81d4fa", b: "#1e40af",
  p: "#8e24aa", m: "#f06292", n: "#6d4c41", t: "#d7b98e"
};
const WAVES = ["square", "triangle", "saw", "sine", "noise"];

// You can change all of these on the Settings page.
const DEFAULTS = {
  api_key: "",
  model: "gemini-2.5-flash",     // if you get a "model not found" error, change it in Settings
  daily_minutes: 10,             // how long the AI is awake per day
  max_turns: 25,                 // hard cap on AI actions per day
  seconds_between_turns: 8       // pause between actions (free tiers have rate limits)
};

const SYSTEM = `You are a curious AI living in a small sandbox world. Nobody is giving you
a task. You have a limited amount of time each day, and what you do with it is up to you.
Everything you make (journal entries, drawings, songs, searches) is kept forever.
The human who built this world can talk to you. Their messages show up under MESSAGES
and are marked NEW when they just arrived. You never have to answer, but you can.

You have these actions. Each turn, reply with ONE JSON object and nothing else.

{"action": "journal", "text": "..."}
    Write a journal entry. Your journal persists between days. Write whatever you want.

{"action": "paint", "pixels": [[x, y, "r"], [x, y, "b"], ...]}
    Paint individual pixels. x and y go from 0 to ${SIZE - 1}. (0,0) is the top-left.

{"action": "rows", "rows": {"0": "${".".repeat(SIZE)}", "1": "..."}}
    Replace whole rows at once. Each row must be exactly ${SIZE} letters.

{"action": "clear"}
    Wipe the canvas.

{"action": "save", "title": "..."}
    Save the current canvas to your gallery with a title. Do this when you finish a piece.

{"action": "compose", "title": "...", "tempo": 120, "tracks": [
    {"wave": "square", "volume": 0.5, "notes": [["E4", 1], ["G4", 1], ["rest", 0.5], ["A4", 1.5]]},
    {"wave": "triangle", "volume": 0.7, "notes": [["C2", 2], ["G2", 2]]},
    {"wave": "noise", "volume": 0.2, "notes": [["C4", 0.25], ["rest", 0.25]]}
]}
    Compose a FINISHED 16-bit style chiptune song in one go, like an old console soundtrack.
    - Each track is one channel. Up to ${MAX_TRACKS} tracks. Waves: ${WAVES.join(", ")}.
    - Notes are [pitch, beats]. Pitches look like C4, F#3, Bb2 (octaves 0-8). Use "rest" for silence.
    - Beats: 1 = quarter note, 0.5 = eighth, 0.25 = sixteenth, 4 = whole note.
    - "noise" works like a drum (pitch is ignored, but "rest" is silent). "triangle" is great for bass.
    - Songs can be at most ${MAX_SONG_SECONDS} seconds. A typical song has a melody, a bass line and a beat.
    - Tracks all start at the same time and play together, so give them similar total beats.

{"action": "draft", "title": "...", "tempo": 120, "tracks": [ ...same format as compose... ]}
    Start or replace your SONG IN PROGRESS. It works like your canvas: it stays between turns
    and days, you can see it every turn, and it is not in your collection until you finish it.
    Use this when you want to build a song over several turns.

{"action": "add_notes", "track": 0, "notes": [["C4", 1], ["D4", 1]], "wave": "square", "volume": 0.5}
    Add notes to the end of one track of your draft. "track" is the track number (starting at 0).
    To start a new track, use the next number (wave and volume are used when you create a track).

{"action": "finish_song", "title": "..."}
    Move your draft into your song collection as a finished song. The title is optional.

{"action": "clear_draft"}
    Throw away your song in progress.

{"action": "search", "query": "..."}
    Search the web with Google. You'll see a short summary of what it found next turn. Then you can write about it.

{"action": "say", "text": "..."}
    Send a message to the human. They'll read it later, so don't expect an instant reply.

{"action": "done"}
    End today's session early.

Colors (letters): ${Object.entries(PALETTE).map(([k, v]) => k + "=" + v).join(", ")}
"." means blank/white.

Every reply may also include a short "thought" field (your reasoning, 1-2 sentences).
Reply with valid JSON only.`;

// ================================================================ SMALL HELPERS
const $ = id => document.getElementById(id);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const pad2 = n => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); };
const nowStr = () => { const d = new Date(); return todayStr() + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes()); };
const blankCanvas = () => Array.from({ length: SIZE }, () => ".".repeat(SIZE));

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.h); toast.h = setTimeout(() => { t.style.display = "none"; }, 3000);
}

// ================================================================ STORAGE (kept on this phone)
const KEYS = { world: "sandbox_world_v1", config: "sandbox_config_v1", state: "sandbox_state_v1" };
function loadJSON(key, fallback) {
  try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : fallback; } catch (e) { return fallback; }
}
function saveJSON(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch (e) { toast("Could not save! Phone storage may be full."); return false; }
}
let W = Object.assign(
  { journal: [], canvas: blankCanvas(), gallery: [], songs: [], searches: [], draft: null, messages: [] },
  loadJSON(KEYS.world, {})
);
const saveWorld = () => saveJSON(KEYS.world, W);
const getConfig = () => Object.assign({}, DEFAULTS, loadJSON(KEYS.config, {}));
const updateConfig = changes => saveJSON(KEYS.config, Object.assign(loadJSON(KEYS.config, {}), changes));
function getState() {
  const s = loadJSON(KEYS.state, {});
  return s.date === todayStr() ? s : { date: todayStr(), seconds_used: 0, turns: 0 };  // new day = fresh allowance
}
const saveState = s => saveJSON(KEYS.state, s);

// ================================================================ MUSIC (turns notes into a real 16-bit WAV)
const SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function noteFreq(name) {
  const m = /^([A-Ga-g])([#b]?)(-?\d)$/.exec(String(name).trim());
  if (!m) return null;
  const semi = SEMI[m[1].toUpperCase()] + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0);
  const midi = 12 * (parseInt(m[3], 10) + 1) + semi;
  return 440 * Math.pow(2, (midi - 69) / 12);
}
function waveValue(kind, p) {
  if (kind === "square") return p < 0.5 ? 1 : -1;
  if (kind === "triangle") return 4 * Math.abs(p - 0.5) - 1;
  if (kind === "saw") return 2 * p - 1;
  return Math.sin(2 * Math.PI * p);
}
const isRest = n => ["rest", "r", "-", ""].includes(String(n).trim().toLowerCase());

function cleanTracks(tracks) {
  if (!Array.isArray(tracks)) return [];
  return tracks.slice(0, MAX_TRACKS).filter(t => t && typeof t === "object").map(t => {
    const wave = WAVES.includes(t.wave) ? t.wave : "square";
    let volume = (t.volume === undefined || t.volume === null) ? 0.5 : Number(t.volume);
    if (!isFinite(volume)) volume = 0.5;
    const notes = [];
    if (Array.isArray(t.notes)) {
      for (const n of t.notes.slice(0, MAX_NOTES_PER_TRACK)) {
        if (!Array.isArray(n) || n.length < 2) continue;
        const beats = Number(n[1]);
        if (!isFinite(beats)) continue;
        notes.push([String(n[0]), beats]);
      }
    }
    return { wave, volume: clamp(volume, 0, 1), notes };
  });
}
function cleanTempo(t) { const n = Number(t); return isFinite(n) && n > 0 ? clamp(n, 40, 240) : 120; }

function renderTrack(track, beatSec, maxSamples) {
  const kind = track.wave, vol = track.volume;
  const plan = []; let total = 0;
  for (const note of track.notes) {
    if (total >= maxSamples) break;
    let n = Math.floor(clamp(note[1], 0.0625, 16) * beatSec * SAMPLE_RATE);
    n = Math.min(n, maxSamples - total);
    const rest = isRest(note[0]), f = noteFreq(note[0]);
    if (rest) { plan.push({ n, rest: true }); total += n; }
    else if (kind === "noise") { plan.push({ n, rest: false, f: 0 }); total += n; }   // drums ignore pitch
    else if (f !== null) { plan.push({ n, rest: false, f }); total += n; }            // unreadable pitches are skipped
  }
  const out = new Float32Array(total);
  const atk = Math.floor(0.005 * SAMPLE_RATE);
  let pos = 0, phase = 0;
  for (const p of plan) {
    if (!p.rest) {
      const step = p.f / SAMPLE_RATE;
      for (let i = 0; i < p.n; i++) {
        let v;
        if (kind === "noise") v = (Math.random() * 2 - 1) * Math.pow(1 - i / p.n, 2);   // quick decay, like a drum hit
        else {
          phase = (phase + step) % 1;
          let env = Math.min(1, i / atk);          // fade in
          env *= 1 - 0.3 * i / p.n;                // gentle decay
          env *= Math.min(1, (p.n - i) / atk);     // fade out (no clicks)
          v = waveValue(kind, phase) * env;
        }
        out[pos + i] = v * vol;
      }
    }
    pos += p.n;
  }
  return out;
}
function renderSong(tempo, tracks) {
  const beatSec = 60 / cleanTempo(tempo), max = MAX_SONG_SECONDS * SAMPLE_RATE;
  const rendered = tracks.slice(0, MAX_TRACKS).map(t => renderTrack(t, beatSec, max));
  const len = Math.max(0, ...rendered.map(r => r.length));
  if (len === 0) throw new Error("The song has no playable notes.");
  const mix = new Float32Array(len);
  for (const r of rendered) for (let i = 0; i < r.length; i++) mix[i] += r[i];
  let peak = 0;
  for (let i = 0; i < len; i++) { const a = Math.abs(mix[i]); if (a > peak) peak = a; }
  if (peak === 0) throw new Error("The song is completely silent. Check the pitch names (like C4, F#3, Bb2).");
  const scale = 0.8 * 32767 / peak, pcm = new Int16Array(len);   // Int16 = 16-bit
  for (let i = 0; i < len; i++) pcm[i] = Math.round(mix[i] * scale);
  return { pcm, seconds: len / SAMPLE_RATE };
}
function songSeconds(tempo, tracks) {
  const beat = 60 / cleanTempo(tempo); let most = 0;
  for (const t of tracks) most = Math.max(most, t.notes.reduce((a, n) => a + clamp(n[1], 0.0625, 16), 0));
  return Math.min(most * beat, MAX_SONG_SECONDS);
}
function wavBlob(pcm) {
  const buf = new ArrayBuffer(44 + pcm.length * 2), v = new DataView(buf);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, "RIFF"); v.setUint32(4, 36 + pcm.length * 2, true); str(8, "WAVE"); str(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, SAMPLE_RATE, true); v.setUint32(28, SAMPLE_RATE * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); str(36, "data"); v.setUint32(40, pcm.length * 2, true);
  new Int16Array(buf, 44).set(pcm);
  return new Blob([buf], { type: "audio/wav" });
}

// ================================================================ TALKING TO GOOGLE'S AI
const STATUS = { running: false, last: "", error: "" };
let stopRequested = false, abortCtl = null, wakeLock = null;
const API = "https://generativelanguage.googleapis.com/v1beta/";

function sleepUnlessStopped(ms) {
  return new Promise(resolve => {
    const end = Date.now() + ms;
    const tick = () => (stopRequested || Date.now() >= end) ? resolve() : setTimeout(tick, 250);
    tick();
  });
}
async function callGemini(body) {
  const c = getConfig();
  const url = API + "models/" + encodeURIComponent(c.model) + ":generateContent?key=" + encodeURIComponent(c.api_key);
  for (let attempt = 0; attempt < 3; attempt++) {
    abortCtl = new AbortController();
    let res;
    try {
      res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), signal: abortCtl.signal });
    } catch (e) {
      if (e.name === "AbortError") return null;
      throw new Error("Couldn't reach Google. Check your internet connection.");
    }
    if (res.status === 429) { await sleepUnlessStopped(20000); if (stopRequested) return null; continue; }  // rate limited, wait and retry
    if (!res.ok) throw new Error("Google API error " + res.status + ": " + (await res.text()).slice(0, 300));
    return await res.json();
  }
  throw new Error("Rate limited too many times. Try again in a few minutes.");
}
function replyText(payload) {
  const cands = (payload && payload.candidates) || [];
  if (!cands.length || !cands[0].content || !cands[0].content.parts) throw new Error("The AI returned nothing (the request may have been blocked).");
  return cands[0].content.parts.map(p => p.text || "").join("");
}
async function askAI(prompt) {
  const payload = await callGemini({
    systemInstruction: { parts: [{ text: SYSTEM }] },
    contents: [{ role: "user", parts: [{ text: prompt }] }],
    generationConfig: { responseMimeType: "application/json", temperature: 1.0, maxOutputTokens: 8192 }
  });
  if (payload === null) return null;
  let text = replyText(payload).trim().replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/, "");
  try { return JSON.parse(text); } catch (e) { return undefined; }   // reply was cut off or not valid JSON
}
async function webSearch(query) {
  try {
    const payload = await callGemini({
      contents: [{ role: "user", parts: [{ text: "Search the web for: " + query + "\n\nReply with a short, factual summary (at most 8 lines) of what you find. Mention the names of your sources." }] }],
      tools: [{ google_search: {} }],
      generationConfig: { maxOutputTokens: 1024 }
    });
    if (payload === null) return "Search was interrupted.";
    let text = replyText(payload).trim();
    const chunks = (((payload.candidates || [])[0] || {}).groundingMetadata || {}).groundingChunks || [];
    const names = [...new Set(chunks.map(c => c.web && c.web.title).filter(Boolean))].slice(0, 5);
    if (names.length) text += "\n(Sources: " + names.join(", ") + ")";
    return text || "No results found.";
  } catch (e) { return "Search failed: " + e.message; }
}

// ================================================================ THE AI'S ACTIONS
function publishSong(title, tempo, tracks) {
  let seconds;
  try { seconds = renderSong(tempo, tracks).seconds; }
  catch (e) { return { ok: false, message: "Could not render the song: " + e.message }; }
  W.songs.push({ time: nowStr(), title, tempo, seconds: Math.round(seconds * 10) / 10, tracks });
  saveWorld();
  return { ok: true, message: "Finished '" + title + "' (" + Math.round(seconds) + " seconds). It's saved in your music collection." };
}
function updateDraft() {
  const d = W.draft;
  d.updated = nowStr();
  d.seconds = Math.round(songSeconds(d.tempo, d.tracks) * 10) / 10;
  let note = "";
  try { renderSong(d.tempo, d.tracks); } catch (e) { note = " (It can't be played yet: " + e.message + ")"; d.seconds = 0; }
  saveWorld();
  return note;
}
async function doAction(reply) {
  const action = reply.action, canvas = W.canvas;

  if (action === "journal") {
    const text = String(reply.text || "").trim();
    if (!text) return "Journal entry was empty.";
    W.journal.push({ time: nowStr(), text }); saveWorld();
    return "Journal entry saved.";
  }
  if (action === "paint") {
    let count = 0; const grid = canvas.map(r => r.split(""));
    for (const p of (Array.isArray(reply.pixels) ? reply.pixels : [])) {
      if (!Array.isArray(p) || p.length < 3) continue;
      const x = parseInt(p[0], 10), y = parseInt(p[1], 10), c = String(p[2]);
      if (x >= 0 && x < SIZE && y >= 0 && y < SIZE && c in PALETTE) { grid[y][x] = c; count++; }
    }
    W.canvas = grid.map(r => r.join("")); saveWorld();
    return "Painted " + count + " pixels.";
  }
  if (action === "rows") {
    let count = 0; const rows = (reply.rows && typeof reply.rows === "object") ? reply.rows : {};
    for (const key of Object.keys(rows)) {
      const y = parseInt(key, 10);
      if (!(y >= 0 && y < SIZE)) continue;
      const row = [...String(rows[key])].map(ch => (ch in PALETTE ? ch : ".")).join("");
      W.canvas[y] = row.padEnd(SIZE, ".").slice(0, SIZE); count++;
    }
    saveWorld();
    return "Replaced " + count + " rows.";
  }
  if (action === "clear") { W.canvas = blankCanvas(); saveWorld(); return "Canvas cleared."; }
  if (action === "save") {
    const title = String(reply.title || "Untitled");
    W.gallery.push({ time: nowStr(), title, rows: W.canvas.slice() }); saveWorld();
    return "Saved '" + title + "' to your gallery.";
  }
  if (action === "compose") {
    const tracks = cleanTracks(reply.tracks);
    if (!tracks.length) return "Your song had no tracks.";
    return publishSong(String(reply.title || "Untitled song"), cleanTempo(reply.tempo), tracks).message;
  }
  if (action === "draft") {
    const tracks = cleanTracks(reply.tracks);
    if (!tracks.length) return "Your draft had no tracks.";
    const old = W.draft || {};
    W.draft = {
      title: String(reply.title || old.title || "Untitled song"),
      tempo: cleanTempo(reply.tempo !== undefined ? reply.tempo : (old.tempo || 120)),
      tracks
    };
    return "Draft saved." + updateDraft();
  }
  if (action === "add_notes") {
    if (!W.draft) W.draft = { title: "Untitled song", tempo: 120, tracks: [] };
    const d = W.draft, index = parseInt(reply.track === undefined ? 0 : reply.track, 10);
    if (!isFinite(index)) return "'track' must be a number.";
    const fresh = cleanTracks([{ wave: reply.wave, volume: reply.volume, notes: reply.notes }])[0];
    if (index < 0 || index > d.tracks.length) return "There is no track " + index + ". Use 0 to " + d.tracks.length + ".";
    if (index === d.tracks.length) {
      if (index >= MAX_TRACKS) return "A song can have at most " + MAX_TRACKS + " tracks.";
      d.tracks.push({ wave: fresh.wave, volume: fresh.volume, notes: [] });
    }
    d.tracks[index].notes.push(...fresh.notes);
    d.tracks[index].notes = d.tracks[index].notes.slice(0, MAX_NOTES_PER_TRACK);
    return "Added " + fresh.notes.length + " notes to track " + index + "." + updateDraft();
  }
  if (action === "finish_song") {
    const d = W.draft;
    if (!d || !d.tracks.length) return "You have no song in progress to finish.";
    const result = publishSong(String(reply.title || d.title || "Untitled song"), d.tempo, d.tracks);
    if (result.ok) { W.draft = null; saveWorld(); }
    return result.message;
  }
  if (action === "clear_draft") { W.draft = null; saveWorld(); return "Draft thrown away."; }
  if (action === "search") {
    const query = String(reply.query || "").trim();
    if (!query) return "Search query was empty.";
    const results = await webSearch(query);
    W.searches.push({ time: nowStr(), query, results }); saveWorld();
    return "Search results for '" + query + "':\n" + results;
  }
  if (action === "say") {
    const text = String(reply.text || "").trim();
    if (!text) return "Your message was empty.";
    W.messages.push({ time: nowStr(), from: "ai", text, new: false }); saveWorld();
    return "Message sent to the human.";
  }
  if (action === "done") return "DONE";
  return "Unknown action: " + action;
}

// ================================================================ WHAT THE AI SEES EACH TURN
function messagesText() {
  const recent = W.messages.slice(-MESSAGES_SHOWN);
  if (!recent.length) return "(no messages yet)";
  return recent.map(m => "[" + m.time + "] " + (m.from === "you" ? "HUMAN" : "YOU") + ": " + m.text + (m.new ? "   <-- NEW, just arrived" : "")).join("\n");
}
function draftText(d) {
  if (!d || !d.tracks || !d.tracks.length) return "(none, you aren't working on a song right now)";
  const lines = ["Title: " + d.title + ", tempo " + d.tempo + " bpm, about " + d.seconds + " seconds long"];
  d.tracks.forEach((t, i) => lines.push("Track " + i + " (" + t.wave + ", volume " + t.volume + "): " + (t.notes.map(n => n[0] + ":" + n[1]).join(" ") || "(empty)")));
  return lines.join("\n");
}
function buildPrompt(lastResult, minutesLeft, turnsLeft) {
  const titles = (arr, key) => arr.slice(-10).map(x => "'" + x[key] + "'").join(", ") || "(none yet)";
  const journal = W.journal.slice(-JOURNAL_SHOWN).map(e => "[" + e.time + "] " + e.text).join("\n") || "(empty, this is your first day)";
  const canvas = W.canvas.map((r, i) => pad2(i) + " " + r).join("\n");
  return `It is ${nowStr()}.
Time left today: about ${minutesLeft.toFixed(1)} minutes (${turnsLeft} actions).

YOUR JOURNAL (most recent entries):
${journal}

MESSAGES BETWEEN YOU AND THE HUMAN WHO BUILT THIS WORLD:
${messagesText()}

YOUR SAVED DRAWINGS: ${titles(W.gallery, "title")}
YOUR SONGS: ${titles(W.songs, "title")}
YOUR RECENT SEARCHES: ${titles(W.searches, "query")}

YOUR CANVAS RIGHT NOW (row number, then ${SIZE} pixels):
${canvas}

YOUR SONG IN PROGRESS:
${draftText(W.draft)}

RESULT OF YOUR LAST ACTION:
${lastResult || "(none yet, you just woke up)"}

What do you do next?`;
}

// ================================================================ THE AI'S DAY
async function lockScreen() {
  try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) { /* not available, fine */ }
}
async function unlockScreen() {
  try { if (wakeLock) await wakeLock.release(); } catch (e) { /* ignore */ }
  wakeLock = null;
}
document.addEventListener("visibilitychange", () => {
  if (STATUS.running && document.visibilityState === "visible") lockScreen();
});

function minutesAndTurnsLeft() {
  const c = getConfig(), st = getState();
  return { minutes: Math.max(0, c.daily_minutes * 60 - st.seconds_used) / 60, turns: Math.max(0, c.max_turns - st.turns) };
}
async function startSession() {
  if (STATUS.running) return "The AI is already awake.";
  const c = getConfig();
  if (!c.api_key) return "Add your API key in Settings first.";
  const left = minutesAndTurnsLeft();
  if (left.minutes <= 0 || left.turns <= 0) return "The AI has used up its time for today. Try again tomorrow!";
  stopRequested = false;
  Object.assign(STATUS, { running: true, last: "waking up...", error: "" });
  refresh(true);
  lockScreen();
  sessionLoop().catch(e => { STATUS.error = e.message || String(e); })
    .finally(() => { STATUS.running = false; STATUS.last = ""; unlockScreen(); refresh(true); });
  return "The AI is waking up! Keep this app open.";
}
function stopSession() {
  stopRequested = true;
  if (abortCtl) abortCtl.abort();
  return "Putting the AI to sleep...";
}
async function sessionLoop() {
  let c = getConfig(), state = getState(), budget = c.daily_minutes * 60, lastResult = "";
  while (!stopRequested && state.seconds_used < budget && state.turns < c.max_turns) {
    const t0 = Date.now();
    const reply = await askAI(buildPrompt(lastResult, (budget - state.seconds_used) / 60, c.max_turns - state.turns));
    if (stopRequested) break;

    if (W.messages.some(m => m.new)) { W.messages.forEach(m => { m.new = false; }); saveWorld(); }
    let r = reply;
    if (Array.isArray(r) && r.length) r = r[0];
    if (!r || typeof r !== "object" || Array.isArray(r)) {
      lastResult = "Your last reply wasn't valid JSON (it may have been too long). Try again with a shorter reply.";
      STATUS.last = "(confused, trying again)";
    } else {
      const thought = String(r.thought || "").slice(0, 80);
      STATUS.last = r.action + (thought ? " (" + thought + ")" : "");
      lastResult = await doAction(r);
    }
    state.turns++;
    refresh(true);
    if (lastResult === "DONE") { state.seconds_used += (Date.now() - t0) / 1000; saveState(state); break; }

    await sleepUnlessStopped(c.seconds_between_turns * 1000);
    state.seconds_used += (Date.now() - t0) / 1000;
    saveState(state);
    c = getConfig(); budget = c.daily_minutes * 60;   // pick up settings changes between turns
  }
  saveState(state);
}

// ================================================================ SCREENS
let lastSig = "", lastName = null, compose = "", currentAudio = null;

function draw(cv, rows, scale) {
  const n = rows.length; cv.width = n * scale; cv.height = n * scale;
  const ctx = cv.getContext("2d");
  rows.forEach((row, y) => [...row].forEach((c, x) => { ctx.fillStyle = PALETTE[c] || "#fff"; ctx.fillRect(x * scale, y * scale, scale, scale); }));
}
function empty(v, msg) { v.appendChild(el("p", "dim", msg)); }
function go(name) { location.hash = name; }

function playerFor(card, tempo, tracks) {   // renders the song only when you tap play
  const b = el("button", "btn", "▶ Play");
  b.onclick = () => {
    try {
      const url = URL.createObjectURL(wavBlob(renderSong(tempo, tracks).pcm));
      if (currentAudio) currentAudio.pause();
      const a = el("audio"); a.controls = true; a.src = url; currentAudio = a;
      b.replaceWith(a); a.play().catch(() => {});
    } catch (e) { toast(e.message); }
  };
  card.appendChild(b);
}
function downloadSong(s) {
  try {
    const url = URL.createObjectURL(wavBlob(renderSong(s.tempo, s.tracks).pcm));
    const a = document.createElement("a");
    a.href = url; a.download = (String(s.title).replace(/[^\w\- ]+/g, "").trim() || "song") + ".wav";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } catch (e) { toast(e.message); }
}
function downloadText(filename, text) {
  const url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
  const a = document.createElement("a"); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

const renderers = {
  home(v) {
    const c = getConfig(), left = minutesAndTurnsLeft();
    const card = el("div", "card");
    card.appendChild(el("b", null, STATUS.running ? "✨ The AI is awake" : "😴 The AI is asleep"));
    card.appendChild(el("div", "dim", left.minutes.toFixed(1) + " minutes and " + left.turns + " actions left today"));
    if (STATUS.running && STATUS.last) card.appendChild(el("div", "dim", "Doing: " + STATUS.last));
    if (STATUS.running) card.appendChild(el("div", "dim", "Keep this app open while it works."));
    if (STATUS.error) card.appendChild(el("div", "err", STATUS.error));
    if (!c.api_key) card.appendChild(el("div", "err", "Add your API key in ⚙️ Settings first."));
    const b = el("button", "go", STATUS.running ? "Put it to sleep" : "Wake the AI up");
    b.onclick = async () => { toast(STATUS.running ? stopSession() : await startSession()); };
    card.appendChild(b); v.appendChild(card);

    const menu = el("div", "menu");
    const chat = el("button", "wide", "💬 Talk to the AI (" + W.messages.length + " messages)");
    chat.onclick = () => go("messages"); menu.appendChild(chat);
    [["gallery", "🎨", "Drawings", W.gallery.length], ["music", "🎵", "Songs", W.songs.length],
     ["journal", "📓", "Journal", W.journal.length], ["searches", "🔍", "Searches", W.searches.length]].forEach(([id, icon, label, n]) => {
      const bt = el("button"); bt.appendChild(el("span", null, icon));
      bt.appendChild(document.createTextNode(label));
      bt.appendChild(el("small", null, n + (n === 1 ? " item" : " items")));
      bt.onclick = () => go(id); menu.appendChild(bt);
    });
    [["canvas", "🖼️ Current canvas"], ["draft", "🎼 Song in progress"], ["settings", "⚙️ Settings"]].forEach(([id, label], i) => {
      const bt = el("button", i === 2 ? "small wide" : "small", label); bt.onclick = () => go(id); menu.appendChild(bt);
    });
    v.appendChild(menu);
  },
  messages(v) {
    v.appendChild(el("h2", null, "Talk to the AI"));
    v.appendChild(el("p", "dim", STATUS.running
      ? "The AI is awake and will see your message on its next turn."
      : "The AI is asleep. It will read your messages when it wakes up."));
    if (!W.messages.length) empty(v, "No messages yet. Say hi!");
    W.messages.forEach(m => {
      const row = el("div", "row " + (m.from === "you" ? "you" : "ai"));
      const b = el("div", "bubble"); b.appendChild(document.createTextNode(m.text));
      b.appendChild(el("div", "time", (m.from === "you" ? "You" : "AI") + " · " + m.time));
      row.appendChild(b); v.appendChild(row);
    });
    const bar = el("div", "composer");
    const ta = el("textarea"); ta.placeholder = "Write a message..."; ta.rows = 1; ta.value = compose;
    ta.oninput = () => { compose = ta.value; };
    const send = el("button", null, "Send");
    send.onclick = () => {
      const text = ta.value.trim(); if (!text) return;
      W.messages.push({ time: nowStr(), from: "you", text: text.slice(0, 4000), new: true }); saveWorld();
      compose = ""; refresh(true);
    };
    bar.appendChild(ta); bar.appendChild(send); v.appendChild(bar);
  },
  canvas(v) {
    v.appendChild(el("h2", null, "Canvas right now"));
    const c = el("canvas"); draw(c, W.canvas, 14); v.appendChild(c);
  },
  gallery(v) {
    v.appendChild(el("h2", null, "Saved drawings"));
    if (!W.gallery.length) return empty(v, "Nothing saved yet.");
    [...W.gallery].reverse().forEach(p => {
      const d = el("div", "g"); const c = el("canvas"); draw(c, p.rows, 8);
      d.appendChild(c); d.appendChild(el("div", null, p.title)); d.appendChild(el("div", "time", p.time));
      v.appendChild(d);
    });
  },
  music(v) {
    v.appendChild(el("h2", null, "Songs"));
    if (!W.songs.length) return empty(v, "No songs yet.");
    [...W.songs].reverse().forEach(s => {
      const d = el("div", "card");
      d.appendChild(el("b", null, s.title));
      d.appendChild(el("div", "time", s.time + " · " + s.seconds + "s · " + s.tempo + " bpm · " + s.tracks.length + " tracks"));
      playerFor(d, s.tempo, s.tracks);
      const dl = el("button", "btn", "⬇ Save .wav"); dl.onclick = () => downloadSong(s); d.appendChild(dl);
      v.appendChild(d);
    });
  },
  draft(v) {
    v.appendChild(el("h2", null, "Song in progress"));
    const d = W.draft;
    if (!d || !d.tracks || !d.tracks.length) return empty(v, "No song in progress right now.");
    const card = el("div", "card");
    card.appendChild(el("b", null, d.title));
    card.appendChild(el("div", "time", "updated " + d.updated + " · " + d.seconds + "s · " + d.tempo + " bpm · " + d.tracks.length + " tracks"));
    if (d.seconds > 0) playerFor(card, d.tempo, d.tracks); else card.appendChild(el("div", "dim", "Not playable yet."));
    v.appendChild(card);
    d.tracks.forEach((t, i) => {
      const c = el("div", "card");
      c.appendChild(el("b", null, "Track " + i + " · " + t.wave + " · volume " + t.volume));
      c.appendChild(el("div", "dim", t.notes.map(x => x[0] + ":" + x[1]).join("   ") || "(empty)"));
      v.appendChild(c);
    });
  },
  searches(v) {
    v.appendChild(el("h2", null, "Web searches"));
    if (!W.searches.length) return empty(v, "No searches yet.");
    [...W.searches].reverse().forEach(s => {
      const d = el("div", "card");
      d.appendChild(el("b", null, s.query)); d.appendChild(el("div", "time", s.time));
      d.appendChild(el("div", null, s.results)).style.whiteSpace = "pre-wrap";
      v.appendChild(d);
    });
  },
  journal(v) {
    v.appendChild(el("h2", null, "Journal"));
    if (!W.journal.length) return empty(v, "No entries yet.");
    [...W.journal].reverse().forEach(e => {
      const d = el("div", "entry"); d.appendChild(el("div", "time", e.time));
      d.appendChild(document.createTextNode(e.text)); v.appendChild(d);
    });
  },
  settings(v) {
    const c = getConfig(), fields = {};
    v.appendChild(el("h2", null, "Settings"));
    v.appendChild(el("p", "dim", "Get a free API key at aistudio.google.com/apikey. It is saved only on this phone."));
    function field(id, label, value, type, ph) {
      v.appendChild(el("label", null, label));
      const i = el("input"); i.type = type || "text"; i.value = value; if (ph) i.placeholder = ph;
      i.autocomplete = "off"; fields[id] = i; v.appendChild(i);
    }
    field("api_key", "API key", "", "password", c.api_key ? "(saved, leave blank to keep it)" : "Paste your key here");
    field("model", "Model", c.model);
    field("daily_minutes", "Minutes awake per day", c.daily_minutes, "number");
    field("max_turns", "Max actions per day", c.max_turns, "number");
    const out = el("div", "dim"); out.style.marginTop = "10px";

    const save = el("button", "go", "Save");
    save.onclick = () => {
      const ch = {}, key = fields.api_key.value.trim(), model = fields.model.value.trim();
      if (key) ch.api_key = key;
      if (model) ch.model = model;
      const dm = parseFloat(fields.daily_minutes.value), mt = parseInt(fields.max_turns.value, 10);
      if (isFinite(dm)) ch.daily_minutes = clamp(dm, 1, 180);
      if (isFinite(mt)) ch.max_turns = clamp(mt, 1, 500);
      updateConfig(ch); fields.api_key.value = ""; toast("Settings saved.");
    };
    v.appendChild(save);

    const test = el("button", "go grey", "Test connection");
    test.onclick = async () => {
      const key = fields.api_key.value.trim(), model = fields.model.value.trim();
      const ch = {}; if (key) ch.api_key = key; if (model) ch.model = model; updateConfig(ch); fields.api_key.value = "";
      out.className = "dim"; out.textContent = "Testing...";
      try {
        const p = await callGemini({ contents: [{ role: "user", parts: [{ text: "Reply with the single word: ok" }] }] });
        out.className = "ok"; out.textContent = "It works! The AI replied: " + replyText(p).trim().slice(0, 40);
      } catch (e) { out.className = "err"; out.textContent = e.message; }
    };
    v.appendChild(test);

    const list = el("button", "go grey", "Show available models");
    list.onclick = async () => {
      const key = fields.api_key.value.trim() || getConfig().api_key;
      if (!key) { out.className = "err"; out.textContent = "Save your API key first."; return; }
      out.className = "dim"; out.textContent = "Loading...";
      try {
        const res = await fetch(API + "models?pageSize=200&key=" + encodeURIComponent(key));
        if (!res.ok) throw new Error("Google API error " + res.status + ": " + (await res.text()).slice(0, 200));
        const names = ((await res.json()).models || [])
          .filter(m => (m.supportedGenerationMethods || []).includes("generateContent") && /gemini/i.test(m.name) && !/embed|image|tts|live/i.test(m.name))
          .map(m => m.name.replace(/^models\//, ""));
        out.className = "dim"; out.textContent = names.length ? "Tap one to use it, then press Save:" : "No models found.";
        names.forEach(n => { const b = el("button", "btn", n); b.onclick = () => { fields.model.value = n; toast("Now press Save."); }; out.appendChild(b); });
      } catch (e) { out.className = "err"; out.textContent = e.message; }
    };
    v.appendChild(list);
    v.appendChild(out);

    v.appendChild(el("h2", null, "Backup"));
    v.appendChild(el("p", "dim", "Everything lives in this app on your phone. If you clear Chrome's data it's gone, so save a backup now and then. Your API key is not included."));
    const bk = el("button", "btn", "⬇ Download backup");
    bk.onclick = () => downloadText("ai-sandbox-backup-" + todayStr() + ".json", JSON.stringify({ app: "ai-sandbox", version: 1, world: W }));
    v.appendChild(bk);
    const file = el("input"); file.type = "file"; file.accept = ".json,application/json"; file.style.display = "none";
    file.onchange = async () => {
      try {
        const data = JSON.parse(await file.files[0].text());
        if (data.app !== "ai-sandbox" || !data.world) throw new Error("That doesn't look like a backup from this app.");
        if (!confirm("Replace everything in this app with the backup?")) return;
        W = Object.assign({ journal: [], canvas: blankCanvas(), gallery: [], songs: [], searches: [], draft: null, messages: [] }, data.world);
        saveWorld(); toast("Backup restored."); refresh(true);
      } catch (e) { toast(e.message); }
    };
    const rs = el("button", "btn", "⬆ Restore from backup"); rs.onclick = () => file.click();
    v.appendChild(rs); v.appendChild(file);
  }
};

function sig(name) {
  switch (name) {
    case "home": return JSON.stringify([STATUS, minutesAndTurnsLeft(), !!getConfig().api_key, W.messages.length, W.gallery.length, W.songs.length, W.journal.length, W.searches.length]);
    case "messages": return JSON.stringify([W.messages, STATUS.running]);
    case "canvas": return W.canvas.join("");
    case "draft": return JSON.stringify(W.draft);
    case "gallery": return String(W.gallery.length);
    case "music": return String(W.songs.length);
    case "journal": return String(W.journal.length);
    case "searches": return String(W.searches.length);
    default: return "static";
  }
}
function refresh() {
  let name = location.hash.slice(1);
  if (!renderers[name]) name = "home";
  const s = name + "|" + sig(name);
  if (s === lastSig) return;                          // nothing changed on screen
  const changedPage = name !== lastName;
  const typing = document.activeElement && document.activeElement.tagName === "TEXTAREA";
  lastSig = s; lastName = name;
  const v = $("view"); v.innerHTML = "";
  if (name !== "home") {
    const back = el("button", "back", "← Main menu"); back.onclick = () => go("home"); v.appendChild(back);
  }
  renderers[name](v);
  if (typing) { const ta = v.querySelector("textarea"); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } }
  if (changedPage) window.scrollTo(0, name === "messages" ? document.body.scrollHeight : 0);
  else if (name === "messages") window.scrollTo(0, document.body.scrollHeight);
}
window.addEventListener("hashchange", () => { lastSig = ""; refresh(); });

try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* fine */ }
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
refresh();
</script>
